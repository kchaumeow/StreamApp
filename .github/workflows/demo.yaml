name: Deployment

concurrency:
  group: production
  cancel-in-progress: true

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKER_TAG_LATEST: ${{ secrets.DOCKER_TAG_LATEST }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_IP: ${{ secrets.SERVER_IP }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: publish
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build --build-arg VITE_BACKEND_URL="$VITE_BACKEND_URL" -t "$DOCKER_TAG_LATEST" .
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      - run: docker push "$DOCKER_TAG_LATEST"
  deployment:
    needs: [publish]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.ID_RSA }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - run: echo "$DOCKER_PASSWORD" | ssh -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_IP" "docker login -u '$DOCKER_USERNAME' --password-stdin"
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - run: ssh -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_IP" "docker pull '$DOCKER_TAG_LATEST'"
      - run: ssh -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_IP" "docker rm --force front || true"
      - run: ssh -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_IP" "docker run -d -p 5173:8080 --name front '$DOCKER_TAG_LATEST'"
      - run: rm -f ~/.ssh/id_rsa
        if: always()
      - run: echo "This job's status is ${{ job.status }}."
